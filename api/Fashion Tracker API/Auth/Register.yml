info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/auth/register
  headers:
    - name: ""
      value: Content-Type
      description: application/json
  body:
    type: json
    data: |-
      {
        "username": "testuser34",
        "email": "user34@example.com",
        "password": "Password123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
