spring.application.name=fashion-tracker

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.enabled=true

logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
logging.level.org.flywaydb=DEBUG

jwt.secret=${JWT_SECRET}

supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}


app.emailjs.service-id=${EMAILJS_SERVICE_ID}
app.emailjs.template-id=${EMAILJS_TEMPLATE_ID}
app.emailjs.public-key=${EMAILJS_PUBLIC_KEY}
app.emailjs.private-key=${EMAILJS_PRIVATE_KEY}

app.frontend-url=${FRONTEND_URL:http://localhost:3000}


app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB